name: macOS Desktop

on:
  push:
    branches:
      - port/macos-desktop
  pull_request:
    branches:
      - astra/vircas-new
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compile desktop app
        run: gradle :desktopApp:compileKotlin

      - name: Build macOS DMG
        run: gradle :desktopApp:packageDmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: VirCas-macOS
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
