name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Compile debug and instrumentation APKs
        run: gradle assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Assemble signed release APK
        run: gradle assembleRelease --stacktrace
      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vircas-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vircas-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
      - name: Upload debug and instrumentation APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vircas-debug-test-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn
